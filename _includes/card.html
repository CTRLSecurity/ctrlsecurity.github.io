<a class="post" href="{{ include.post.url | relative_url }}" data-lang-only="{{ include.post.lang }}"><div class="cover cover-{{ include.post.cover | default: 'blue' }}"><div class="meta"><span>{{ include.post.tag }}</span><span>{{ include.post.date | date: "%d.%m.%y" }}</span></div></div><div class="body"><h3>{{ include.post.title }}</h3><p>{{ include.post.description }}</p><div class="read">› {{ include.post.read }} min <span data-i18n="b.read"></span></div></div></a>
